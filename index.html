<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>على الموجة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marhey:wght@400;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: a radio receiver at night. Dark teal cabinet, a backlit cream tuning dial in the middle,
   a red tuning needle, LED level meters for the two teams. One committed dark look. */
:root{
  --cab:#0a1b20; --cab2:#0f262c; --cab3:#15353c; --cab4:#1c4650; --line:#24525c;
  --fg:#ecf3ef; --mut:#8fb0ad; --dim:#5f817e;
  --face:#f5ead0; --face2:#e9d9b4; --ink:#2b2119;
  --amber:#ffb53d; --amber2:#ff8f1f; --needle:#ff4636;
  --b2:#f3c24f; --b3:#ee8a3a; --b4:#22b5a3;
  --red:#ff6161; --red2:#d53c48; --blue:#4aaeff; --blue2:#2a6cc6;
  --t-n:#3fd6c1; --t-sq:#b996ff; --t-bm:#ff5a48; --t-sp:#ffd43e;
  --f-disp:'Marhey','Readex Pro','Segoe UI',Tahoma,sans-serif;
  --f-body:'Readex Pro','Segoe UI',Tahoma,Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--cab);color:var(--fg);font-family:var(--f-body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body.is-host{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);overflow:hidden}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#app{height:100%;position:relative}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  background:radial-gradient(70% 55% at 50% 72%,rgba(255,181,61,.10),transparent 70%),
             radial-gradient(60% 40% at 50% 0%,rgba(63,214,193,.07),transparent 70%),
             linear-gradient(180deg,#0c2127 0%,var(--cab) 55%,#071519 100%)}
.bg svg{position:absolute;left:0;bottom:0;width:100%;height:24vh;opacity:.5}
.bg .w1{animation:drift 26s linear infinite}
.bg .w2{animation:drift 38s linear infinite reverse;opacity:.6}
@keyframes drift{to{transform:translateX(-960px)}}

/* ---------- shared bits ---------- */
.disp{font-family:var(--f-disp);font-weight:700;letter-spacing:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.8em 1.4em;border-radius:999px;
  background:linear-gradient(180deg,#ffc65c,var(--amber2));color:#2a1700;font-weight:700;font-size:1.05rem;
  box-shadow:0 6px 0 #a5520a,0 10px 24px rgba(255,143,31,.25);transition:transform .08s,box-shadow .08s,filter .2s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a5520a}
.btn[disabled]{filter:grayscale(1) brightness(.6);cursor:not-allowed;box-shadow:0 6px 0 #333}
.btn.ghost{background:var(--cab3);color:var(--fg);box-shadow:0 5px 0 #0a1a1e}
.btn.sm{padding:.5em 1em;font-size:.9rem}
.chip{display:inline-flex;align-items:center;gap:.4em;padding:.3em .8em;border-radius:999px;background:var(--cab3);font-size:.9rem;white-space:nowrap}
.tchip{display:inline-flex;align-items:center;gap:.45em;padding:.35em .9em .35em .8em;border-radius:999px;font-weight:600;border:2px solid currentColor;background:rgba(0,0,0,.25)}
.tchip.n{color:var(--t-n)} .tchip.sq{color:var(--t-sq)} .tchip.bm{color:var(--t-bm)} .tchip.sp{color:var(--t-sp)}
.red{--tc:var(--red);--tc2:var(--red2)} .blue{--tc:var(--blue);--tc2:var(--blue2)}
.av{display:inline-grid;place-items:center;width:2.2em;height:2.2em;border-radius:50%;background:var(--cab3);line-height:1;flex:none}
.av svg{width:100%;height:100%;display:block;overflow:visible}
.big-av .av{width:96px;height:96px;background:transparent}
.who{display:inline-flex;align-items:center;gap:.45em}
.pcard .who.lg{font-size:1.3rem;font-weight:700;color:var(--fg)}
.pcard .who.lg .av{width:2.4em;height:2.4em}
.opts small .who .av{width:1.6em;height:1.6em}
.mut{color:var(--mut)}
.lamp{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:var(--needle);box-shadow:0 0 0 3px rgba(255,70,54,.25),0 0 16px var(--needle);animation:blink 1.6s ease-in-out infinite;flex:none}
@keyframes blink{50%{opacity:.35;box-shadow:0 0 0 3px rgba(255,70,54,.1),0 0 4px var(--needle)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ---------- the dial (shared) ---------- */
.dial{display:block;width:100%;height:auto;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none}
.dial .face{fill:url(#gFace)}
.dial .bez{fill:url(#gBez)}
.dial .tk{stroke:#9fc3bd;stroke-width:2;opacity:.55}
.dial .tk.M{stroke:var(--amber);stroke-width:3.5;opacity:1}
.dial .fq{fill:#9fc3bd;font:500 15px var(--f-body);opacity:.7;text-anchor:middle;dominant-baseline:middle}
.dial .bd{stroke:var(--face);stroke-width:2}
.dial .b2{fill:var(--b2)} .dial .b3{fill:var(--b3)} .dial .b4{fill:var(--b4)}
.dial .bn{fill:#2b2119;font:700 30px var(--f-disp);text-anchor:middle;dominant-baseline:middle;opacity:.85}
.dial .bmb{fill:url(#gHatch);stroke:#1a0a08;stroke-width:3}
.dial .bmi{font-size:44px;text-anchor:middle;dominant-baseline:middle}
.dial .sh-in{transform-box:view-box;transform-origin:500px 520px;transition:transform 2.5s cubic-bezier(.55,0,.25,1)}
.dial.open .sh-in{transform:rotate(180deg)}
.dial .grl{fill:url(#gGrill)}
.dial .gls{fill:url(#gGloss)}
.dial .logo{fill:#3c6d72;font:700 40px var(--f-disp);text-anchor:middle;opacity:.55}
.dial .ndw{filter:drop-shadow(0 7px 5px rgba(0,0,0,.45))}
.dial .nd-b{fill:url(#gNeedle);stroke:#7d1912;stroke-width:1.5;stroke-linejoin:round}
.dial .nd-hl{stroke:#fff;stroke-width:2;stroke-linecap:round;opacity:.45}
.dial .hub0{fill:url(#gHub);stroke:#2c5f69;stroke-width:3}
.dial .hub1{fill:url(#gBrass);stroke:#8d560c;stroke-width:2}
.dial .hubhl{fill:#fff;opacity:.28}
.dial .hub2{fill:#9a6212;stroke:#6b420a;stroke-width:1.5}
.dial .hubs{stroke:#4d3006;stroke-width:2.6;stroke-linecap:round}
.dial .base{fill:#0e2a30;stroke:#24525c;stroke-width:2}
.dial .tgl{stroke:#2b2119;stroke-width:3;stroke-dasharray:6 6;opacity:.8}

.board{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none;overflow:visible}
.board .bfr{fill:#0e2a30;stroke:var(--amber);stroke-width:5}
.board .bface{fill:url(#gFaceSq)}
.board .gl{stroke:#2b2119;stroke-width:1.5;opacity:.18}
.board .ax{stroke:#2b2119;stroke-width:3;opacity:.4}
.board .r2{fill:var(--b2)} .board .r3{fill:var(--b3)} .board .r4{fill:var(--b4)}
.board .rr{stroke:var(--face);stroke-width:2}
.board .bn{fill:#2b2119;font:700 22px var(--f-disp);text-anchor:middle;dominant-baseline:middle;opacity:.85}
.board .sh-in{transition:transform 2.5s cubic-bezier(.55,0,.25,1)}
.board.open .sh-in{transform:translateY(-640px)}
.board .grl{fill:url(#gGrill)} .board .gls{fill:url(#gGloss2)}
.board .logo{fill:#3c6d72;font:700 34px var(--f-disp);text-anchor:middle;opacity:.55}
.board .pk{filter:drop-shadow(0 5px 4px rgba(0,0,0,.45))}
.board .pk-h{fill:rgba(255,70,54,.16);stroke:#fff;stroke-width:2.2;stroke-dasharray:5 5;opacity:.8}
.board .pk-o{fill:url(#gPuck);stroke:#fff;stroke-width:4}
.board .pk-x{stroke:#fff;stroke-width:3;stroke-linecap:round}

.labs{display:flex;justify-content:space-between;gap:12px;margin-top:-.2em}
.lab{font-family:var(--f-disp);font-weight:600;display:flex;align-items:center;gap:.4em;padding:.25em .9em;border-radius:14px;background:var(--cab3);
  border:2px solid var(--cab4);line-height:1.35;max-width:48%;text-wrap:balance}
.lab .ar{color:var(--amber);font-size:.8em}
.sqwrap{position:relative;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr auto;gap:10px;align-items:center;justify-items:center}
.sqwrap .lab{max-width:none}
.sqwrap .lt{grid-column:2;grid-row:1}
.sqwrap .lb{grid-column:2;grid-row:3}
.sqwrap .lr{grid-column:1;grid-row:2;max-width:7.5em;flex-direction:column;text-align:center;padding:.4em .5em}
.sqwrap .ll{grid-column:3;grid-row:2;max-width:7.5em;flex-direction:column;text-align:center;padding:.4em .5em}
.sqwrap .bwrap{grid-column:2;grid-row:2;width:100%}

/* ---------- home / join ---------- */
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-block:32px;text-align:center}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px}
.brand h1{margin:0;font-family:var(--f-disp);font-weight:700;font-size:clamp(3rem,13vw,6.5rem);line-height:1.05;color:var(--face);
  text-shadow:0 0 30px rgba(255,181,61,.35),0 4px 0 #6b3d08}
.brand .sine{width:min(320px,70vw);height:34px}
.brand .sine path{fill:none;stroke:var(--amber);stroke-width:4;stroke-linecap:round;stroke-dasharray:14 10;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-48}}
.brand p{margin:0;color:var(--mut);font-size:1.05rem;max-width:30ch;text-wrap:balance}
.pick{display:grid;gap:14px;width:min(360px,100%)}
.pick .btn{font-size:1.2rem;padding:1em}
.note{max-width:40ch;color:var(--mut);font-size:.92rem;line-height:1.6;text-wrap:pretty}
.warn{max-width:40ch;background:rgba(255,90,72,.12);border:1px solid rgba(255,90,72,.4);color:#ffd3cc;padding:12px 16px;border-radius:14px;line-height:1.6}
.form{width:min(440px,100%);display:flex;flex-direction:column;gap:18px;text-align:start}
.form label{font-weight:600;font-size:.95rem;color:var(--mut);display:block;margin-bottom:6px}
.inp{width:100%;padding:.8em 1em;border-radius:14px;border:2px solid var(--cab4);background:var(--cab2);font-size:1.15rem;outline:none}
.inp:focus{border-color:var(--amber)}
.inp.code{font-family:var(--f-disp);font-size:2rem;text-align:center;letter-spacing:.35em;direction:ltr}
.avs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.avs button{height:62px;border-radius:16px;background:var(--cab2);border:2px solid transparent;transition:transform .1s;display:grid;place-items:center;padding:4px}
.avs .av{width:50px;height:50px;background:transparent}
.avs button[aria-pressed="true"]{border-color:var(--amber);background:var(--cab3);transform:scale(1.06)}
.tpick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tpick button{padding:14px 10px;border-radius:16px;background:var(--cab2);border:3px solid transparent;font-weight:700;font-size:1.1rem;display:flex;flex-direction:column;align-items:center;gap:4px}
.tpick button small{font-weight:400;color:var(--mut);font-size:.8rem}
.tpick button.red[aria-pressed="true"]{border-color:var(--red);background:rgba(255,97,97,.12)}
.tpick button.blue[aria-pressed="true"]{border-color:var(--blue);background:rgba(74,174,255,.12)}
.err{color:#ff9d90;font-size:.92rem;min-height:1.4em}

/* ---------- HOST ---------- */
.lobby{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:3.5vw;padding:4.5vh 4vw}
.lb-a{display:flex;flex-direction:column;gap:3.2vh;justify-content:center;min-width:0}
.lb-a .brand{align-items:flex-start}
.lb-a .brand h1{font-size:clamp(3rem,8.5vw,9rem);text-align:start}
.lb-a .brand p{font-size:clamp(1rem,1.5vw,1.6rem);max-width:none}
.how{display:grid;gap:1.4vh;margin:0;padding:0;list-style:none}
.how li{display:grid;grid-template-columns:2.4em 1fr;gap:.9em;align-items:center;font-size:clamp(.95rem,1.35vw,1.4rem);line-height:1.5}
.how .n{display:grid;place-items:center;width:2.4em;height:2.4em;border-radius:50%;background:var(--cab3);color:var(--amber);font-family:var(--f-disp);font-weight:700;border:2px solid var(--cab4)}
.pts{display:flex;gap:.6em;flex-wrap:wrap;align-items:center;font-size:clamp(.9rem,1.2vw,1.2rem)}
.pts span{padding:.2em .8em;border-radius:999px;color:#2b2119;font-weight:700}
.set{display:flex;align-items:center;gap:1em;flex-wrap:wrap;font-size:clamp(1rem,1.3vw,1.3rem)}
.seg3{display:inline-flex;background:var(--cab2);border-radius:999px;padding:4px;border:2px solid var(--cab4)}
.seg3 button{padding:.35em 1.1em;border-radius:999px;font-weight:700;font-family:var(--f-disp)}
.seg3 button[aria-pressed="true"]{background:var(--amber);color:#2a1700}
.startrow{display:flex;align-items:center;gap:1.2em;flex-wrap:wrap}
.startrow .btn{font-size:clamp(1.1rem,1.7vw,1.8rem);padding:.75em 1.8em}
.lb-b{display:flex;flex-direction:column;gap:3vh;min-width:0;justify-content:center}
.join{display:flex;gap:2.2vw;align-items:center;background:linear-gradient(160deg,var(--cab3),var(--cab2));border:2px solid var(--cab4);border-radius:28px;padding:2.4vh 2vw}
.qr{background:#fff;padding:10px;border-radius:16px;width:clamp(110px,13vw,240px);aspect-ratio:1;flex:none}
.qr svg{display:block;width:100%;height:100%}
.join .k{color:var(--mut);font-size:clamp(.9rem,1.2vw,1.3rem)}
.join .code{font-family:var(--f-disp);font-weight:700;font-size:clamp(3rem,7.5vw,8rem);line-height:1;letter-spacing:.12em;color:var(--amber);direction:ltr;text-shadow:0 0 30px rgba(255,181,61,.35)}
.join .hint{font-size:clamp(.85rem,1.1vw,1.2rem);line-height:1.6;color:var(--fg);opacity:.85}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:1.6vw}
.tcol{background:var(--cab2);border-radius:24px;padding:1.8vh 1.2vw;border-top:5px solid var(--tc);min-height:24vh;display:flex;flex-direction:column;gap:1.2vh}
.tcol h3{margin:0;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-disp);font-size:clamp(1.1rem,1.8vw,2rem);color:var(--tc)}
.tcol h3 small{font-family:var(--f-body);color:var(--mut);font-size:.55em;font-weight:400}
.plist{display:flex;flex-wrap:wrap;gap:.6em}
.botadd{font-family:var(--f-body);font-size:clamp(.75rem,.95vw,1rem);padding:.3em .8em;border-radius:999px;background:rgba(255,255,255,.06);border:1px dashed var(--tc);color:var(--fg);font-weight:600;white-space:nowrap}
.botadd:hover{background:rgba(255,255,255,.12)}
.pchip .x{margin-inline-start:.2em;width:1.5em;height:1.5em;border-radius:50%;background:rgba(255,255,255,.08);font-size:.75em;display:inline-grid;place-items:center}
.pchip.bot{border:1px dashed var(--line)}
.ainote{color:var(--mut);font-size:clamp(.8rem,1vw,1.05rem);line-height:1.6}
.pchip{display:inline-flex;align-items:center;gap:.45em;padding:.3em .9em .3em .35em;border-radius:999px;background:var(--cab3);font-size:clamp(.9rem,1.25vw,1.3rem);animation:pop .45s both}
.pchip .av{width:1.9em;height:1.9em;background:rgba(255,255,255,.06)}
.pchip.off{opacity:.4}
.empty{color:var(--dim);font-size:clamp(.85rem,1.1vw,1.1rem)}
.tbar{display:flex;justify-content:space-between;align-items:center;gap:1em;flex-wrap:wrap}

.hg{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-top:2vh}
.sb{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:2.5vw;align-items:start;padding:0 3vw}
.tp{display:flex;flex-direction:column;gap:1vh;transition:filter .4s,opacity .4s}
.tp.b{align-items:flex-end}
.tp.idle{opacity:.55;filter:saturate(.6)}
.tp .row{display:flex;align-items:center;gap:1vw}
.tp .nm{font-family:var(--f-disp);font-weight:700;font-size:clamp(1.1rem,2vw,2.3rem);color:var(--tc)}
.tp .scr{font-family:var(--f-disp);font-weight:700;font-size:clamp(2.2rem,4.6vw,5.4rem);line-height:.9;color:var(--fg);font-variant-numeric:tabular-nums;text-shadow:0 0 24px var(--tc)}
.tp .scr.bump{animation:pop .6s}
.meter{display:flex;gap:.35vw;width:min(34vw,560px)}
.tp.b .meter{direction:ltr}
.meter i{flex:1;height:clamp(8px,1.3vh,16px);border-radius:3px;background:rgba(255,255,255,.07);transition:background .4s,box-shadow .4s}
.meter i.on{background:var(--tc);box-shadow:0 0 12px var(--tc)}
.mem{display:flex;gap:.4vw;flex-wrap:wrap}
.tp.b .mem{justify-content:flex-end}
.mem .av{width:clamp(28px,2.6vw,46px);height:clamp(28px,2.6vw,46px);font-size:clamp(15px,1.4vw,26px);transition:transform .3s,box-shadow .3s}
.mem .av.ld{box-shadow:0 0 0 3px var(--amber),0 0 16px var(--amber);transform:scale(1.15)}
.mem .av.off{opacity:.35}
.mid{display:flex;flex-direction:column;align-items:center;gap:.6vh;padding-top:.6vh}
.mid .rdp{font-family:var(--f-disp);font-weight:700;font-size:clamp(1.1rem,2vw,2.3rem);color:var(--face);line-height:1.2}
.mid .goal{color:var(--mut);font-size:clamp(.85rem,1.2vw,1.35rem);font-family:var(--f-disp)}

.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;min-height:0;padding:1vh 3vw 0;position:relative}
.turnline{display:flex;align-items:center;gap:1vw;flex-wrap:wrap;justify-content:center;font-size:clamp(.9rem,1.35vw,1.5rem)}
.turnline .who{display:flex;align-items:center;gap:.45em}
.turnline .tmn{color:var(--tc);font-family:var(--f-disp)}
.turnline .crown{font-size:.9em}
.clue{display:flex;align-items:center;justify-content:center;gap:1.2vw;min-height:clamp(64px,11vh,150px);padding:1vh 2.4vw;border-radius:22px;
  background:linear-gradient(180deg,#071417,#0d2429);border:2px solid var(--cab4);box-shadow:inset 0 0 40px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.02);max-width:min(1200px,90vw)}
.clue .k{color:var(--mut);font-size:clamp(.8rem,1.1vw,1.2rem);white-space:nowrap;display:flex;align-items:center;gap:.5em}
.clue .tx{font-family:var(--f-disp);font-weight:700;font-size:clamp(1.8rem,4.6vw,5.6rem);line-height:1.15;color:var(--face);text-shadow:0 0 22px rgba(255,181,61,.45);text-wrap:balance;text-align:center}
.clue .tx.wait{font-size:clamp(1.1rem,2.2vw,2.6rem);color:var(--mut);text-shadow:none}
.clue .tx.in{animation:pop .5s}
.dots::after{content:'';display:inline-block;width:1.2em;text-align:start;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.dialbox{position:relative;width:min(84vw,1200px);min-width:280px;flex:none}
.dialbox.sq{width:min(84vw,700px)}
.dialbox .labs{font-size:clamp(.95rem,1.55vw,1.8rem)}
.sqwrap{font-size:clamp(.9rem,1.35vw,1.6rem)}
.cd{position:absolute;inset-inline-start:2vw;top:0;width:clamp(70px,9vw,150px);aspect-ratio:1;display:grid;place-items:center}
.cd svg{position:absolute;inset:0;transform:rotate(-90deg)}
.cd circle{fill:none;stroke-width:8}

<body>
<div id="app" dir="rtl" lang="ar"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
"use strict";
window.APP_URL = location.href.split("#")[0];
/* ================= نسخة GitHub: الاتصال عن طريق سيرفر وسيط (MQTT) بدل الاتصال المباشر =================
   كل جهاز بيتصل بالإنترنت عادي، فبيشتغل على أي شبكة (واي فاي أو نت موبايل). */
(function () {
  if (window.claude && window.claude.use) return;
  const BROKERS = window.RELAY_TEST || ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt'];
  const BASE = 'alamawja/v2/';
  const BEAT = 1500, DEAD = 7000;

  function makeRoom(name) {
    const code = String(name).replace(/^mw-/, '');
    const T = BASE + code + '/';
    const cid = 'mw' + Math.random().toString(36).slice(2, 12);
    let me = {}, mode = null, closed = false, connected = false, sendT = null, beat = null;
    let handlers = [], connHs = [];
    const peers = new Map();   // host: phones by id
    let hostSt = null, hostSeen = 0, hostAt = 0;
    const clients = [];

    const fire = () => {
      const list = mode === 'host'
        ? [...peers.values()].map((p) => ({ peer: p.id, presence: p.pres, updatedAt: p.at, isMe: false }))
        : hostSt ? [{ peer: 'host', presence: hostSt, updatedAt: hostAt, isMe: false }] : [];
      for (const h of handlers) { try { h({ peers: list, joined: [], left: [], updated: [] }); } catch (e) { console.error(e); } }
    };
    const setConn = () => {
      const c = clients.some((x) => x.connected);
      if (c === connected) return; connected = c;
      for (const f of connHs) { try { f(c); } catch (e) { /* */ } }
    };
    const pub = (topic, obj) => { const s = JSON.stringify(obj); for (const c of clients) if (c.connected) { try { c.publish(topic, s, { qos: 0 }); } catch (e) { /* */ } } };
    const send = () => {
      sendT = null; if (closed || !mode) return;
      if (mode === 'host') pub(T + 'h', { p: me, t: Date.now() });
      else pub(T + 'p/' + cid, { p: me });
    };
    const queue = () => { if (!sendT) sendT = setTimeout(send, 40); };

    function onMsg(topic, buf) {
      let d; try { d = JSON.parse(buf.toString()); } catch (e) { return; }
      if (!d || typeof d !== 'object') return;
      if (mode === 'host' && topic.startsWith(T + 'p/')) {
        const id = topic.slice((T + 'p/').length);
        if (d.bye) { if (peers.delete(id)) fire(); return; }
        if (!d.p || typeof d.p !== 'object') return;
        const old = peers.get(id), js = JSON.stringify(d.p);
        if (old) { old.seen = Date.now(); if (old.js === js) return; old.js = js; old.pres = d.p; old.at = Date.now(); }
        else peers.set(id, { id, pres: d.p, js, at: Date.now(), seen: Date.now() });
        fire();
      } else if (mode === 'player' && topic === T + 'h') {
        if (!d.p || typeof d.p !== 'object') return;
        hostSeen = Date.now();
        const js = JSON.stringify(d.p);
        if (hostSt && JSON.stringify(hostSt) === js) return;
        hostSt = d.p; hostAt = Date.now(); fire();
      }
    }
    function start() {
      for (const url of BROKERS) {
        let c;
        try { c = mqtt.connect(url, { clientId: cid + clients.length, clean: true, keepalive: 20, reconnectPeriod: 2000, connectTimeout: 8000 }); }
        catch (e) { continue; }
        c.on('connect', () => {
          c.subscribe(mode === 'host' ? T + 'p/+' : T + 'h', { qos: 0 });
          setConn(); send();
        });
        c.on('message', onMsg);
        c.on('close', setConn); c.on('offline', setConn); c.on('error', () => {});
        clients.push(c);
      }
      beat = setInterval(() => {
        send();
        const now = Date.now();
        if (mode === 'host') { let ch = false; for (const [k, p] of peers) if (now - p.seen > DEAD) { peers.delete(k); ch = true; } if (ch) fire(); }
        else if (hostSt && now - hostSeen > DEAD) { hostSt = null; fire(); }
      }, BEAT);
      addEventListener('pagehide', () => { if (mode === 'player') pub(T + 'p/' + cid, { bye: 1 }); });
    }

    return {
      presence(patch) {
        for (const k in patch) { if (patch[k] === null) delete me[k]; else me[k] = patch[k]; }
        if (!mode && (me.role === 'host' || me.role === 'player')) { mode = me.role; start(); }
        queue(); return Promise.resolve();
      },
      onPeers(h) { handlers.push(h); setTimeout(fire, 0); return () => { handlers = handlers.filter((x) => x !== h); }; },
      onConnection(f) { connHs.push(f); setTimeout(() => f(connected), 0); return () => { connHs = connHs.filter((x) => x !== f); }; },
      peers() { return []; },
      connected() { return connected; },
      emit() { return Promise.resolve(); },
      on() { return () => {}; },
      leave() {
        if (mode === 'player') pub(T + 'p/' + cid, { bye: 1 });
        closed = true; clearInterval(beat); delete rooms[name];
        setTimeout(() => { for (const c of clients) { try { c.end(true); } catch (e) { /* */ } } }, 200);
        return Promise.resolve();
      },
    };
  }
  const rooms = {};
  const lobby = { join: async (name) => rooms[name] || (rooms[name] = makeRoom(name)) };
  window.claude = { use: async (n) => (n === 'room' && window.mqtt ? lobby : null) };
})();

const SCALES = [

function guessPrompt(t) {

function fallbackClue(t) {
  const side = (g, s) => (g < 35 ? noEmoji(s[0]) : g > 65 ? noEmoji(s[1]) : 'بين بين');
  const c = t.ty === 'sq' ? side(t.g[0], t.sx) + ' و' + side(t.g[1], t.sy) : side(t.g, t.s);
  return clean(c.replace(DIGITS_G, ''), 30) || 'بين بين';
}
function fallbackGuess(t) {
  const one = (s) => {
    const c = t.cl || '';
    if (c.includes(noEmoji(s[0]))) return rnd(10, 26);
    if (c.includes(noEmoji(s[1]))) return rnd(74, 90);
    if (c.includes('بين')) return rnd(42, 58);
    return rnd(25, 75);
  };
  return t.ty === 'sq' ? [r1(one(t.sx)), r1(one(t.sy))] : r1(one(t.s));
}
function startBotLead(t) {
  if (!isBot(t.ld) || t.botFor === t.ld) return;
  t.botFor = t.ld;
  t.botP = aiJSON(leadPrompt(t), t.ty === 'sp' ? 11000 : 15000).then((r) => {
    const c = r && typeof r.clue === 'string' ? clean(r.clue.replace(DIGITS_G, ''), 30) : '';
    return c || fallbackClue(t);
  });
}
function botSubmit(t) {
  if (!isBot(t.ld)) return;
  startBotLead(t);
  const t0 = Date.now(), ld = t.ld;
  t.botP.then((clue) => {
    const wait = t.ty === 'sp' ? 500 : Math.max(400, 2600 - (Date.now() - t0));
    later(wait, () => { if (H.t === t && H.ph === 'clue' && !t.cl && t.ld === ld) submitClue(clue); });
  });
}
function startBotGuess(t) {
  const bots = onlineIn(t.tm).filter((p) => p.bot && p.pid !== t.ld);
  if (!bots.length) return;
  const bot = pick(bots), t0 = Date.now();
  aiJSON(guessPrompt(t), 15000).then((r) => {
    let g = null;
    if (r && t.ty === 'sq' && isFinite(+r.x) && isFinite(+r.y)) g = [r1(clamp(+r.x, 0, 100)), r1(clamp(+r.y, 0, 100))];
    else if (r && t.ty !== 'sq' && isFinite(+r.v)) g = r1(clamp(+r.v, 0, 100));
    if (g == null) g = fallbackGuess(t);
    later(Math.max(300, 2200 - (Date.now() - t0)), () => {
      if (H.t !== t || H.ph !== 'guess') return;
      botMove(t, bot.pid, g, () => {
        const humans = onlineIn(t.tm).filter((p) => !p.bot && p.pid !== t.ld);
        if (!humans.length) later(2200, () => { if (H.t === t && H.ph === 'guess') doReveal(); });
      });
    });

}
function botMove(t, pid, to, done) {
  const from = Array.isArray(t.n) ? t.n.slice() : t.n, N = 24; let i = 0;
  const iv = setInterval(() => {
    if (H.t !== t || H.ph !== 'guess') { clearInterval(iv); return; }
    i++; const k = i / N, e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    t.n = Array.isArray(from) ? [r1(from[0] + (to[0] - from[0]) * e), r1(from[1] + (to[1] - from[1]) * e)] : r1(from + (to - from) * e);
    t.mover = pid; push();
    if (i >= N) { clearInterval(iv); if (done) done(); }

}
function botVotes() {
  const e = H.end;
  for (const p of H.P.values()) {
    if (!p.bot || !p.on) continue;
    later(rnd(2000, 6000), () => {
      if (H.ph !== 'vote' || H.end !== e || e.votes[p.pid]) return;
      const cs = (e.vo || []).filter((x) => x[2] !== p.pid), ps = [...H.P.values()].filter((x) => x.on && x.pid !== p.pid);

    });

}

        h('form', { class: 'compose', onsubmit: (e) => { e.preventDefault(); send(); } },
          h('div', { class: 'row' }, u.inp, u.send), u.err),
      ];
      cue = t.ty === 'bm' ? '✍️ اكتب تلميحك، وبعّدهم عن 💣' : '✍️ اكتب تلميحك'; cls = 'lead';
      setTimeout(() => { try { u.inp.focus(); } catch (e) { /* */ } }, 50);
    } else {
      const blk = t.ty === 'sq' ? boardBlock(t.sx, t.sy) : dialBlock(t.s);
      u.svg = blk.svg; u.svg.querySelector(t.ty === 'sq' ? '.pk' : '.ndw').style.display = 'none';
      u.cd = t.ty === 'sp' ? h('div', { class: 'pclue cdn', style: { color: 'var(--t-sp)' } }, '15') : null;
      main = [card(
        pwho(t.ld, 'lg'),
        svgEl({ class: 'static', viewBox: '0 0 120 40', 'aria-hidden': 'true' }, Array.from({ length: 12 }, (_, i) => `<rect x="${i * 10 + 2}" y="4" width="6" height="32" rx="3" style="transform-origin:${i * 10 + 5}px 20px;animation-delay:${((i * 0.37) % 0.9).toFixed(2)}s"/>`).join('')),
        u.cd), h('div', { class: 'pdial' }, blk.wrap)];
      cue = t.tm === M.tm ? '✍️ التلميح جاي' : 'دور ' + TEAMS[t.tm].dot + ' ' + TEAMS[t.tm].name;
    }
  } else if (view === 'guess' || view === 'reveal') {
    const role = t.ld === M.pid ? 'lead' : t.tm === M.tm ? 'guess' : 'watch';
    const blk = t.ty === 'sq' ? boardBlock(t.sx, t.sy) : dialBlock(t.s);
    u.svg = blk.svg; u.sq = t.ty === 'sq';
    const n = t.n; M.cur = Array.isArray(n) ? n.slice() : n;
    if (u.sq) setPuck(u.svg, n); else setNeedle(u.svg, n);
    const showT = view === 'reveal' ? t.rv : role === 'lead' ? t.sec : null;
    if (showT) { if (u.sq) setRings(u.svg, showT.g); else setBands(u.svg, showT.g, showT.b); }
    if (role === 'lead' && view === 'guess') setShutter(u.svg, true, true);
    const clue = [h('div', { class: 'pclue' }, t.cl || '—')];
    if (view === 'guess') {
      if (role === 'guess') {
        bindDrag(u.svg, u.sq);
        u.lock = lockBtn(t.id);
        main = [...clue, h('div', { class: 'pdial' }, blk.wrap), u.lock];
        cue = 'حرّكوا واتفقوا 🗣️'; cls = 'go';
      } else if (role === 'lead') {
        main = [...clue, h('div', { class: 'pdial' }, blk.wrap)];
        cue = '🤐 ممنوع تحكي'; cls = 'hot';
      } else {
        main = [...clue, h('div', { class: 'pdial' }, blk.wrap)];
        cue = 'دور ' + TEAMS[t.tm].dot + ' ' + TEAMS[t.tm].name + ' 👀';
      }
    } else {
      const rv = t.rv;
      if (rv.f) {
        setShutter(u.svg, true, true);
        main = [card(h('div', { class: 'big-ic' }, '⏰'), h('h2', null, 'خلص الوقت!')), h('div', { class: 'pdial' }, blk.wrap)];
        cue = 'الدور الجاي…';
      } else if (rv.st === 0) {
        setTimeout(() => setShutter(u.svg, true, false), 60);
        main = [...clue, h('div', { class: 'pdial' }, blk.wrap), h('div', { class: 'drum', 'aria-label': 'طبل' }, '🥁')];
        cue = '🥁';
      } else {
        setShutter(u.svg, true, true);
        const mine = t.tm === M.tm, big = rv.bh ? '−2' : rv.p ? '+' + rv.p : '0';
        const txt = rv.bh ? '💥 قنبلة!' : RES[rv.p].t;
        main = [h('div', { class: 'pres ' + tcls(t.tm) }, h('div', { class: 'n' }, big), h('div', { class: 't' }, mine ? txt : TEAMS[t.tm].dot + ' ' + TEAMS[t.tm].name + ': ' + txt)), h('div', { class: 'pdial' }, blk.wrap)];
        cue = 'الدور الجاي…';
        cls = mine && rv.p ? 'go' : 'wait';
        const bk = t.id + 'rv';
        if (M.buzzed !== bk) { M.buzzed = bk; if (mine) buzz(rv.bh ? [300, 80, 300] : rv.p ? [60, 40, 60, 40, 140] : [200]); else buzz(50); }
      }
    }
    startPhoneLoop();
  } else if (view === 'pause') {
    main = card(h('div', { class: 'big-ic' }, '📡'), h('h2', null, 'استنّوا شوي'), h('p', null, st.msg || ''));
    cue = 'اللعبة متوقفة شوي';
  } else if (view === 'win') {
    const w = st.e && st.e.w, mine = w === M.tm;
    if (mine) { confetti(3500); buzz([80, 40, 80, 40, 200]); }
    main = card(h('div', { class: 'big-ic' }, !w ? '🤝' : mine ? '🏆' : '😬'), h('h2', null, !w ? 'تعادل!' : mine ? 'ربحتوا!' : 'خسرتوا…'),
      h('p', null, (w && !mine) ? 'وفي عجلة عقوبات بتستنّاكم 😈' : 'هلأ وقت الألقاب'));
    cue = 'استنّوا… جاي التصويت';
  } else if (view === 'vote') {
    main = buildVote(); cue = 'صوّتوا من هون';
    cls = 'go';
    if ((st.e.vd || []).includes(M.pid)) { cue = 'صوتك وصل ✓'; cls = 'wait'; }
  } else if (view === 'titles') {
    const T = st.e.T, me = T && T.who === M.pid;
    if (me) { confetti(3000); buzz([80, 40, 160]); }
    main = card(h('div', { class: 'big-ic' }, T ? T.ic : '🥁'), h('h2', null, T ? T.n : 'الألقاب عالشاشة الكبيرة 👀'),
      T ? (me ? h('p', { style: { fontSize: '1.4rem', color: 'var(--fg)' } }, '🎉 إنت!') : pwho(T.who, 'lg')) : null);
    cue = 'عيونكم عالشاشة 👀';
  } else if (view === 'wheel') {
    const e = st.e, loser = e.w && M.tm === other(e.w);
    if (loser && e.spin < 0) {
      main = [card(h('div', { class: 'big-ic' }, '🎡'), h('h2', null, 'إنتو الخسرانين 😬'), h('p', null, 'حدا منكم يلفّ العجلة… وحظ موفّق')),
        h('button', { class: 'btn spinbtn', onclick: (ev) => { ev.currentTarget.disabled = true; setP({ sp: e.wk }); buzz(60); } }, '🎡 لفّ العجلة')];
      cue = 'اضغط ولفّ'; cls = 'hot';
    } else if (e.done) {
      main = card(h('div', { class: 'big-ic' }, '😈'), h('h2', null, 'العقوبة طلعت!'), h('p', null, 'شوفوها عالشاشة الكبيرة'));
      cue = loser ? 'يلا نفّذوا 😂' : 'استمتعوا بالعرض 😂';
    } else {
      main = card(h('div', { class: 'big-ic' }, '🎡'), h('h2', null, e.spin >= 0 ? 'عم تلف…' : 'استنّوا الخسرانين يلفّوا'));
      cue = 'عيونكم عالشاشة 👀';
    }
  } else if (view === 'over') {
    main = card(h('div', { class: 'big-ic' }, '📻'), h('h2', null, 'شكراً على السهرة!'),
      h('div', { class: 'mini', style: { fontSize: '2.4rem' } }, h('span', { class: 'b' }, String(st.sc[1])), h('i', null, '—'), h('span', { class: 'r' }, String(st.sc[0]))),
      h('p', null, 'إذا بدكم جولة كمان، اضغطوا عالشاشة الرئيسية'));
    cue = 'استنّوا الجولة الجاي';
  } else {
    main = card(h('h2', null, '📻'));
  }
  app.replaceChildren(bgEl(), phoneShell(main, cue, cls));
}

function buildVote() {
  const st = M.st, e = st.e;
  if (!M.vote || M.vote.k !== e.k) M.vote = { k: e.k, step: 0, c: -1, p: '' };
  const V = M.vote;
  if ((e.vd || []).includes(M.pid) || V.step >= 2) return card(h('div', { class: 'big-ic' }, '🗳️'), h('h2', null, 'تمام! صوتك وصل'), h('p', null, 'استنّوا الباقي يصوّتوا'));
  const clues = (e.vo || []).filter((x) => x[2] !== M.pid);
  if (V.step === 0 && clues.length) {
    return [card(h('div', { class: 'big-ic' }, '😂'), h('h2', null, 'أحلى تلميح الليلة'), h('p', null, 'أي تلميح ضحّككم أكثر؟')),
      h('div', { class: 'opts' }, clues.map((x) => h('button', { type: 'button', onclick: () => { V.c = x[0]; V.step = 1; rerender(); } },
        h('span', null, h('span', { class: 'q' }, '«' + x[1] + '»'), h('small', null, pwho(x[2])))))),
      h('button', { class: 'btn ghost sm', type: 'button', onclick: () => { V.c = -1; V.step = 1; rerender(); } }, 'ولا واحد، تخطّى')];
  }
  const ps = st.pl.filter((p) => p[0] !== M.pid);
  return [card(h('div', { class: 'big-ic' }, '🗣️'), h('h2', null, 'ملك النقاش'), h('p', null, 'مين أكثر واحد كان يجادل ويفلسف؟')),
    h('div', { class: 'opts' }, ps.map((p) => h('button', { type: 'button', onclick: () => { V.p = p[0]; V.step = 2; setP({ vt: { k: e.k, c: V.c, p: V.p } }); buzz(40); rerender(); } },
      avNode(p[2]), h('span', null, p[1], h('small', null, TEAMS[p[3]].dot + ' ' + TEAMS[p[3]].name)))))];
}

function updPhone() {
  const st = M.st, u = M.ui; if (!st) return;
  if (u.sr) { u.sr.textContent = String(st.sc[0]); u.sb.textContent = String(st.sc[1]); }
  if (u.roster && st.ph === 'lobby') {
    const mates = st.pl.filter((p) => p[3] === M.tm);
    const key = mates.map((p) => p[0] + p[1] + p[2]).join(',');
    if (u.rk !== key) { u.rk = key; u.roster.replaceChildren(...mates.map((p) => h('span', { class: 'pchip' }, avNode(p[2]), p[1]))); }
  }
  if (u.cd && st.t) {
    const rem = Math.max(0, M.dl - Date.now()), s = Math.min(15, Math.ceil(rem / 1000));
    u.cd.textContent = String(s); u.cd.style.color = s <= 3 ? 'var(--needle)' : 'var(--t-sp)';
  }
  if (u.lock && st.t) {
    const done = M.locked === st.t.id;
    u.lock.disabled = done;
    if (done) $('span', u.lock).textContent = '🔒 ثبّتنا';
  }
}
let phoneRAF = 0;
function startPhoneLoop() {
  cancelAnimationFrame(phoneRAF);
  const loop = () => {
    const u = M.ui, t = M.st && M.st.t;
    if (!u.svg || !t || !u.svg.isConnected) return;
    const mine = M.drag || Date.now() - M.dragAt < 700;
    const target = mine && M.local != null ? M.local : t.n;
    if (u.sq) {
      if (Array.isArray(target)) { M.cur = mine ? target.slice() : [M.cur[0] + (target[0] - M.cur[0]) * 0.3, M.cur[1] + (target[1] - M.cur[1]) * 0.3]; setPuck(u.svg, M.cur); }
    } else if (typeof target === 'number') { M.cur = mine ? target : M.cur + (target - M.cur) * 0.3; setNeedle(u.svg, M.cur); }
    phoneRAF = requestAnimationFrame(loop);
  };
  phoneRAF = requestAnimationFrame(loop);
}
function bindDrag(svg, sq) {
  const val = (e) => {
    const m = svg.getScreenCTM(); if (!m) return null;
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const q = p.matrixTransform(m.inverse());
    if (sq) return [r1(clamp((600 - q.x) / 6, 0, 100)), r1(clamp((600 - q.y) / 6, 0, 100))];
    const dx = q.x - DL.cx, dy = DL.cy - q.y;
    const a = dy <= 0 ? (dx >= 0 ? 0 : Math.PI) : Math.atan2(dy, dx);
    return r1(clamp((a / Math.PI) * 100, 0, 100));
  };
  const send = (v) => {
    const t = M.st && M.st.t; if (v == null || !t || M.locked === t.id) return;
    M.local = v; M.ndS++; setP({ nd: { id: t.id, v, s: M.ndS } });
  };
  svg.addEventListener('pointerdown', (e) => {
    const t = M.st && M.st.t; if (!t || M.locked === t.id) return;
    e.preventDefault(); try { svg.setPointerCapture(e.pointerId); } catch (_) { /* */ }
    M.drag = true; send(val(e));
  });
  svg.addEventListener('pointermove', (e) => { if (M.drag) send(val(e)); });
  const up = () => { if (M.drag) { M.drag = false; M.dragAt = Date.now(); } };
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up); svg.addEventListener('lostpointercapture', up);
}
function lockBtn(tid) {
  const b = h('button', { class: 'lock', type: 'button' }, h('i', { class: 'fill' }), h('span', null, '✋ اضغط مطوّل للتثبيت'));
  let tmr = null;
  const fire = () => { if (M.locked === tid) return; M.locked = tid; setP({ lk: tid }); buzz(50); updPhone(); };
  const start = (e) => { e.preventDefault(); if (M.locked === tid) return; b.classList.add('hold'); clearTimeout(tmr); tmr = setTimeout(() => { b.classList.remove('hold'); fire(); }, 750); };
  const stop = () => { clearTimeout(tmr); b.classList.remove('hold'); };
  b.addEventListener('pointerdown', start); b.addEventListener('pointerup', stop); b.addEventListener('pointerleave', stop); b.addEventListener('pointercancel', stop);
  b.addEventListener('contextmenu', (e) => e.preventDefault());
  b.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fire(); } });
  return b;
}

/* ================= البداية ================= */
function showHome(note) {
  document.body.classList.remove('is-host');
  clearInterval(H.tick); clearInterval(M.tick); H.view = ''; cancelAnimationFrame(needleRAF); cancelAnimationFrame(phoneRAF); MUSIC.stop(0.3);
  const hs = store.json('mw_host');
  const canResume = hs && hs.code && Date.now() - hs.at < 6 * 3600e3 && !H.r;
  const me = loadMe();
  const canRejoin = me && me.code && me.name && !M.r;
  app.replaceChildren(bgEl(), h('div', { class: 'home' },
    h('div', { class: 'brand' },
      h('div', { class: 'chip' }, h('span', { class: 'lamp' }), 'على الهوا'),
      h('h1', null, 'على الموجة'),
      sineSvg(),
      h('p', null, 'لعبة تلميحات وقراءة أفكار، فريقين ضد بعض.')),
    h('div', { class: 'pick' },
      h('button', { class: 'btn', onclick: () => startHost() }, '📺 الشاشة الرئيسية'),
      h('button', { class: 'btn ghost', onclick: () => showJoin() }, '📱 أنا لاعب'),
      canResume ? h('button', { class: 'btn ghost sm', onclick: () => startHost(hs) }, '↩️ كمّل السهرة (كود ' + hs.code + ')') : null,
      canRejoin ? h('button', { class: 'btn ghost sm', onclick: () => { M.code = me.code; M.name = me.name; M.av = CHAR_IDS.includes(me.av) ? me.av : pick(CHAR_IDS); M.tmReq = me.tm || ''; joinPhone(); } }, '↩️ ارجع للعبة كـ ' + me.name + ' (كود ' + me.code + ')') : null),
    note ? h('div', { class: 'warn', role: 'alert' }, note) : null,
    h('p', { class: 'note' }, 'افتحوا هالرابط على التلفزيون أو اللابتوب واختاروا «الشاشة الرئيسية». كل واحد بيفتحه من جواله وبيختار «أنا لاعب». الصوت بيطلع من الشاشة الرئيسية.')));
}
(function boot() {
  ensureDefs();
  const m = (location.hash || '').match(/^#c(\d{4})$/);
  const me = loadMe();
  if (m && me.code === m[1] && me.name) { M.code = me.code; M.name = me.name; M.av = CHAR_IDS.includes(me.av) ? me.av : pick(CHAR_IDS); M.tmReq = me.tm || ''; joinPhone(); }
  else if (m) showJoin(m[1]); else showHome();
})();
